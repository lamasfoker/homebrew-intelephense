name: Update trail-code

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Bump formula (trail-code version + vendored Node.js LTS)
        id: bump
        run: script/bump-trail-code.sh

      - name: Show diff
        run: git diff --stat

      - name: Build and test the bumped formula
        if: steps.bump.outputs.changed == '1'
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/lamasfoker"
          mkdir -p "$TAP_DIR"
          ln -sfn "$GITHUB_WORKSPACE" "$TAP_DIR/homebrew-tap"
          brew install --formula --build-from-source lamasfoker/tap/trail-code
          brew test lamasfoker/tap/trail-code

      - name: Open PR
        id: pr
        if: steps.bump.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "trail-code: automated version bump"
          branch: automated/bump-trail-code
          delete-branch: true
          title: "trail-code: automated version bump"
          body: |
            Automated bump by `.github/workflows/update-trail-code.yml`.
            `brew install --build-from-source` + `brew test` passed on macos-14 before this PR was opened.

      - name: Enable auto-merge
        if: steps.bump.outputs.changed == '1' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
